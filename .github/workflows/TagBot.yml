name: TagBot

on:
  # Trigger the workflow on issue comments
  issue_comment:
    types:
      - created
  
  # Allow manual triggering of the workflow from the GitHub Actions tab
  workflow_dispatch:

jobs:
  TagBot:
    # Only run the workflow if triggered manually or by JuliaTagBot comments
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    # Run the TagBot workflow on the latest Ubuntu runner
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
