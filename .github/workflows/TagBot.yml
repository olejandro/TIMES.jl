name: TagBot

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  TagBot:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
