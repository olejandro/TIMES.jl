name: TagBot

on:
  # Trigger the workflow on a schedule (weekly at midnight)
  schedule:
    - cron: "0 0 * * 0"
  
  # Allow manual triggering of the workflow from the GitHub Actions tab
  workflow_dispatch:

jobs:
  TagBot:
    # Run the TagBot workflow on the latest Ubuntu runner
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
